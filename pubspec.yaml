name: evote
description: "Evote - Events & Votes Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP & API
  dio: ^5.4.0
  retrofit: ^4.1.0

  # State Management
  provider: ^6.1.2

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^8.0.0

  # Navigation
  go_router: ^13.2.0

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.0
  smooth_page_indicator: ^1.1.0
  carousel_slider: ^5.0.0
  fl_chart: ^0.66.0

  # Forms
  reactive_forms: ^17.0.1

  # Utils
  intl: ^0.19.0
  timeago: ^3.6.1
  url_launcher: ^6.2.6
  share_plus: ^7.2.2
  image_picker: ^1.0.7
  permission_handler: ^11.3.1
  mobile_scanner: ^4.0.1
  webview_flutter: ^4.4.2

  # PDF & File sharing
  pdf: ^3.11.0
  path_provider: ^2.1.4

  # Animations
  flutter_animate: ^4.5.0

  # Icons
  hugeicons: 1.1.7

dependency_overrides:
  win32: 5.13.0
  flutter_plugin_android_lifecycle: 2.0.31
  image_picker_android: 0.8.13+1
  path_provider_android: 2.2.19
  shared_preferences_android: 2.4.13
  sqflite: 2.4.2
  url_launcher_android: 6.3.20
  webview_flutter_android: 4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1A6BFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  min_sdk_android: 23
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#1A6BFF"
    theme_color: "#1A6BFF"
