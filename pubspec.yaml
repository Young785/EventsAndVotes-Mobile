name: evote
description: "Evote - Events & Votes Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP & API
  dio: ^5.4.0
  retrofit: ^4.1.0

  # State Management
  provider: ^6.1.2

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # Navigation
  go_router: ^13.2.0

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.0
  smooth_page_indicator: ^1.1.0
  carousel_slider: ^5.0.0
  fl_chart: ^0.66.0

  # Forms
  reactive_forms: ^17.0.1

  # Utils
  intl: ^0.19.0
  timeago: ^3.6.1
  url_launcher: ^6.2.6
  share_plus: ^9.0.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  mobile_scanner: ^6.0.2
  webview_flutter: ^4.10.0

  # PDF & File sharing
  pdf: ^3.11.0
  path_provider: ^2.1.4

  # Animations
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1A6BFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  min_sdk_android: 23
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#1A6BFF"
    theme_color: "#1A6BFF"
